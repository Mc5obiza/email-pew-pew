name: Backend CI

on:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  backend-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-test.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-test.txt
      - name: Run tests on non-main branches
        if: github.ref != 'refs/heads/main'
        run: python backend/run_pipeline.py --tests-only
      - name: Run tests and live LLM smoke test on main
        if: github.ref == 'refs/heads/main'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python backend/run_pipeline.py
